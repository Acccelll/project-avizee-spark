name: Temporary revert legacy migrations

on:
  push:
    branches: [feat/fiscal-cte-nfse-roadmap]
    paths: [.github/workflows/tmp-revert-legacy-migrations.yml]

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fiscal-cte-nfse-roadmap
          fetch-depth: 0
      - name: Restore historical migrations from main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- \
            supabase/migrations/20260412203000_apresentacao_pr42_corretiva.sql \
            supabase/migrations/20260416025122_31c95787-e81a-4c49-83ea-e6fd7ebc1287.sql
          rm .github/workflows/tmp-revert-legacy-migrations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260412203000_apresentacao_pr42_corretiva.sql \
                  supabase/migrations/20260416025122_31c95787-e81a-4c49-83ea-e6fd7ebc1287.sql \
                  .github/workflows/tmp-revert-legacy-migrations.yml
          git commit -m "chore(ci): retirar alterações em migrations históricas"
          git push origin HEAD:feat/fiscal-cte-nfse-roadmap
