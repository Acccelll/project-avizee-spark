name: Temporary pgTAP function replay fix

on:
  push:
    branches: [feat/fiscal-cte-nfse-roadmap]
    paths: [.github/workflows/tmp-fix-pgtap-function.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fiscal-cte-nfse-roadmap
      - name: Allow historical function return type transition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260416025122_31c95787-e81a-4c49-83ea-e6fd7ebc1287.sql')
          s = p.read_text()
          marker = '''-- PART 4: Financeiro RPCs v2\nCREATE OR REPLACE FUNCTION public.financeiro_processar_estorno(p_lancamento_id UUID, p_motivo TEXT DEFAULT 'Estorno manual')\n'''
          replacement = '''-- PART 4: Financeiro RPCs v2\n-- A migration anterior criou a mesma assinatura retornando void. PostgreSQL\n-- não permite alterar o tipo de retorno com CREATE OR REPLACE, portanto a\n-- transição histórica precisa remover explicitamente a versão anterior.\nDROP FUNCTION IF EXISTS public.financeiro_processar_estorno(UUID, TEXT);\nCREATE OR REPLACE FUNCTION public.financeiro_processar_estorno(p_lancamento_id UUID, p_motivo TEXT DEFAULT 'Estorno manual')\n'''
          if marker not in s:
              raise SystemExit('expected function marker not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY
          rm .github/workflows/tmp-fix-pgtap-function.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260416025122_31c95787-e81a-4c49-83ea-e6fd7ebc1287.sql .github/workflows/tmp-fix-pgtap-function.yml
          git commit -m "fix(ci): permitir transição histórica do RPC de estorno"
          git push origin HEAD:feat/fiscal-cte-nfse-roadmap
