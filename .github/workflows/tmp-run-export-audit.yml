name: Run temporary export audit patch
on:
  push:
    branches: [fix/export-relatorios-filtros-completos]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/export-relatorios-filtros-completos
      - run: python scripts/tmp_export_audit_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/social.service.ts src/services/workbook/workbookGenerator.service.ts src/pages/WorkbookGerencial.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(export): completar Social e histórico Workbook [tmp-audit-export]"
          git push origin HEAD:fix/export-relatorios-filtros-completos
