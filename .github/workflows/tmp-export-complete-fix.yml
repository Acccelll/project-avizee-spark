            `${label} excedeu o limite seguro de ${REPORT_HARD_CAP.toLocaleString("pt-BR")} registros. Refine o período.`,
          );
        },
      });

      const [lancs, contas, baixasRaw] = await Promise.all([
        fetchAllPages(
          () => supabase
            .from("financeiro_lancamentos")
            .select(
              "id, tipo, valor, saldo_restante, valor_pago, status, data_vencimento, data_pagamento, conta_bancaria_id, descricao, forma_pagamento, nota_fiscal_id, documento_pai_id, observacoes, contas_bancarias(descricao, bancos(nome))",
            )
            .eq("ativo", true)
            .gte("data_vencimento", dataInicio)
            .lte("data_vencimento", dataFim),
          failOnTruncate("Fluxo de caixa"),
        ),
        fetchAllPages(
          () => supabase
            .from("contas_bancarias")
            .select("*, bancos(nome)")
            .eq("ativo", true),
          failOnTruncate("Contas bancárias"),
        ),
        fetchAllPages(
          () => supabase
            .from("financeiro_baixas")
            .select(
              "id, lancamento_id, data_baixa, valor_pago, conta_bancaria_id, financeiro_lancamentos!inner(tipo)",
            )
            .is("estornada_em", null)
            .gte("data_baixa", dataInicio)
            .lte("data_baixa", dataFim),
          failOnTruncate("Baixas do fluxo de caixa"),
        ),
      ]);'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f'Fluxo Caixa Promise.all block matched {count}')
          text = text.replace('const baixas: BaixaFluxo[] = ((baixasRaw as BaixaJoinRow[] | null) ?? []).map', 'const baixas: BaixaFluxo[] = ((baixasRaw as unknown as BaixaJoinRow[]) ?? []).map', 1)
          text = text.replace('lancamentos: (lancs as Lancamento[]) ?? [],', 'lancamentos: (lancs as unknown as Lancamento[]) ?? [],', 1)
          text = text.replace('contasBancarias: (contas as ContaBancaria[]) ?? [],', 'contasBancarias: (contas as unknown as ContaBancaria[]) ?? [],', 1)
          save(path, text)

          # 9) Conciliação de Cartão: remove arbitrary 200 cap and fetch all filtered invoices.
          path = 'src/pages/financeiro/ConciliacaoCartao.tsx'
          text = load(path)
          text = text.replace('import { exportarParaExcel } from "@/services/export.service";\n', 'import { exportarParaExcel } from "@/services/export.service";\nimport { fetchAllPages, REPORT_HARD_CAP } from "@/services/_lib/fetchAllPages";\n', 1)
          old = '''    queryFn: async () => {
      let q = supabase
        .from("cartao_faturas")
        .select("id, cartao_id, competencia, data_fechamento, data_vencimento, valor_total, status, cartoes_credito(nome, ultimos4)")
        .order("data_vencimento", { ascending: false })
        .limit(200);
      if (cartaoFilters.length > 0) q = q.in("cartao_id", cartaoFilters);
      if (inicio) q = q.gte("data_vencimento", inicio);
      if (fim) q = q.lte("data_vencimento", fim);
      if (statusFilters.length > 0) q = q.in("status", statusFilters);
      const { data, error } = await q;
      if (error) throw error;
      return (data ?? []) as unknown as FaturaRow[];
    },'''
          new = '''    queryFn: async () => {
      let truncated = false;
      const data = await fetchAllPages(() => {
        let q = supabase
          .from("cartao_faturas")
          .select("id, cartao_id, competencia, data_fechamento, data_vencimento, valor_total, status, cartoes_credito(nome, ultimos4)")
          .order("data_vencimento", { ascending: false });
        if (cartaoFilters.length > 0) q = q.in("cartao_id", cartaoFilters);
        if (inicio) q = q.gte("data_vencimento", inicio);
        if (fim) q = q.lte("data_vencimento", fim);
        if (statusFilters.length > 0) q = q.in("status", statusFilters);
        return q;
      }, { onTruncated: () => { truncated = true; } });
      if (truncated) {
        throw new Error(
          `A consulta excedeu o limite seguro de ${REPORT_HARD_CAP.toLocaleString("pt-BR")} faturas. Refine os filtros.`,
        );
      }
      return data as unknown as FaturaRow[];
    },'''
          if old not in text:
              raise RuntimeError('ConciliacaoCartao faturas query block not found')
          text = text.replace(old, new, 1)
          save(path, text)

          print('Temporary patch completed successfully')
          PY

