name: Temporary complete export patch

on:
  push:
    branches:
      - fix/export-relatorios-filtros-completos

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tmp-export-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/export-relatorios-filtros-completos
          fetch-depth: 0

      - name: Apply surgical export fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = load(path)
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'Pattern not found in {path}: {old[:120]!r}')
              save(path, text.replace(old, new, 1))

          def regex_once(path, pattern, repl, flags=0):
              text = load(path)
              new_text, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'Regex matched {count} times in {path}: {pattern}')
              save(path, new_text)

          # 1) Remove the abandoned hidden registry approach. Explicit exportRows only.
          p = Path('src/hooks/useSupabaseCrud.ts')
          text = load(p)
          text = text.replace('import { useRegisterExportRowsLoader } from "@/lib/exportRowsRegistry";\n', '')
          text = text.replace('\n  useRegisterExportRowsLoader(table, fetchAllRows);\n', '\n')
          save(p, text)
          registry = Path('src/lib/exportRowsRegistry.ts')
          if registry.exists():
              registry.unlink()

          # 2) Explicitly wire generic server-paged CRUD pages.
          for path in [
              'src/pages/Clientes.tsx',
              'src/pages/Fornecedores.tsx',
              'src/pages/Transportadoras.tsx',
              'src/pages/GruposEconomicos.tsx',
          ]:
              text = load(path)
              m = re.search(r'(?m)^(\s*)fetchData,\n\1page,', text)
              if not m:
                  raise RuntimeError(f'fetchData/page destructure not found: {path}')
              indent = m.group(1)
              text = text[:m.start()] + f'{indent}fetchData,\n{indent}fetchAllRows,\n{indent}page,' + text[m.end():]
              m = re.search(r'(?m)^(\s*)serverPagination=\{\{', text)
              if not m:
                  raise RuntimeError(f'serverPagination not found: {path}')
              indent = m.group(1)
              text = text[:m.start()] + f'{indent}exportRows={{fetchAllRows}}\n{indent}serverPagination={{{{' + text[m.end():]
              save(path, text)

          # 3) Produtos: same full loader, plus exact client-side filters/dedupe/display mapping.
          path = 'src/pages/Produtos.tsx'
          text = load(path)
          text = text.replace('import { useEffect, useMemo, useState } from "react";', 'import { useCallback, useEffect, useMemo, useState } from "react";', 1)
          m = re.search(r'(?m)^(\s*)fetchData,\n\1page,', text)
          if not m:
              raise RuntimeError('Produtos fetchData/page destructure not found')
          indent = m.group(1)
          text = text[:m.start()] + f'{indent}fetchData,\n{indent}fetchAllRows,\n{indent}page,' + text[m.end():]
          old = '''  const filteredData = useMemo(() => {
    const needsClientFilter = hasEstoqueFilter || hasSemGrupoFilter;
    const filtered = needsClientFilter
      ? data.filter((p) => {
          if (hasEstoqueFilter) {
            const situacao = getSituacaoEstoque(p);
            if (!estoqueFilters.includes(situacao)) return false;
          }
          if (hasSemGrupoFilter) {
            if (!grupoFilters.includes(p.grupo_id || "sem_grupo")) return false;
          }
          return true;
        })
      : data;
    return dedupeProdutosCanonicos(filtered).map<ProdutoTableRow>((produto) => ({
      ...produto,
      display_codigo: getProdutoDisplayCodigo(produto),
      display_sku_secundario: getProdutoDisplaySkuSecundario(produto),
    }));
  }, [data, hasEstoqueFilter, hasSemGrupoFilter, estoqueFilters, grupoFilters]);'''
          new = '''  const prepareProdutoRows = useCallback((source: Produto[]): ProdutoTableRow[] => {
    const needsClientFilter = hasEstoqueFilter || hasSemGrupoFilter;
    const filtered = needsClientFilter
      ? source.filter((p) => {
          if (hasEstoqueFilter) {
            const situacao = getSituacaoEstoque(p);
            if (!estoqueFilters.includes(situacao)) return false;
          }
          if (hasSemGrupoFilter) {
            if (!grupoFilters.includes(p.grupo_id || "sem_grupo")) return false;
          }
          return true;
        })
