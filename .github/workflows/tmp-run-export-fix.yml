name: Run temporary export patch

on:
  push:
    branches:
      - fix/export-relatorios-filtros-completos

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/export-relatorios-filtros-completos
          fetch-depth: 0
      - name: Execute embedded patch
        shell: bash
        run: |
          python <<'PYRUN'
          from pathlib import Path
          import textwrap
          raw = Path('.github/workflows/tmp-export-complete-fix.yml').read_text(encoding='utf-8')
          start = "          python <<'PY'\n"
          end = "\n          PY\n\n      - name: Commit patched files"
          if start not in raw or end not in raw:
              raise RuntimeError('Embedded patch markers not found')
          code = raw.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(code), 'tmp-export-patch.py', 'exec'))
          PYRUN
      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(export): completar fontes filtradas [tmp-export-fix]"
          git push origin HEAD:fix/export-relatorios-filtros-completos
