name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck (strict core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck:core

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  coverage:
    name: Vitest coverage (thresholds)
    runs-on: ubuntu-latest
    # Floors anti-regressão configurados em vitest.config.ts.
    # TODO(7.2): subir os limites conforme novos testes de services entram
    # até alcançar a meta do roadmap (global 60%, services/utils 80%).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: Playwright E2E (advisory)
    runs-on: ubuntu-latest
    # TODO(7.3): promover a bloqueante após provisionar ambiente de preview
    # com seed determinístico + credenciais E2E_* nos GitHub Secrets.
    # Enquanto faltar `E2E_BASE_URL`, os specs se auto-pulam (ver
    # `e2e/fixtures/env.ts`), então o job nunca falha por ausência de env.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Bundle budget (advisory)
        # Etapa 8.4 — detecta regressão de tamanho do bundle inicial.
        # Promover a bloqueante após estabilizar baseline (ajustar BUDGET_KB).
        continue-on-error: true
        run: npm run check:bundle-budget

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    # Não bloqueia o PR enquanto saneamos as dependências legadas;
    # promover a bloqueante após zerar 'high' e 'critical'.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  schema-drift:
    name: Schema drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:schema-drift

  db-tests:
    name: pgTAP (database)
    runs-on: ubuntu-latest
    # TODO(7.4): promover a bloqueante após validar verde em runs reais.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db

  touch-targets:
    name: Touch targets (advisory)
    runs-on: ubuntu-latest
    # TODO(7.4): promover a bloqueante após sanear violações em ProdutoForm e
    # demais telas com size="icon" h-9 w-9 (alvo de toque < 44px).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:touch-targets